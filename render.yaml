services:
  - type: web
    name: midama-temporary-portal
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_D1_DATABASE_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        value: mid-ama-promo-files
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        value: Mid-Ama Promo <portal@midamapromo.co.za>
      - key: ADMIN_EMAIL
        value: remoabetswemolefi@gmail.com
      - key: APP_ORIGIN
        value: https://portal.midamapromo.co.za
