name = "midama-temporary-portal"
main = "src/worker.js"
compatibility_date = "2026-10-29"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "midama-portal"
database_id = "0c6ab22f-5a0c-45a5-9b0d-3ae461cd6642"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "R2"
bucket_name = "mid-ama-promo-files"

[vars]
APP_ORIGIN = "https://portal.midamapromo.co.za"
ADMIN_EMAIL = "remoabetswemolefi@gmail.com"
RESEND_FROM = "Mid-Ama Promo <portal@midamapromo.co.za>"
